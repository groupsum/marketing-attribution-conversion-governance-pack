  "body": "## Primary Targets\n\n- W3C Attribution Reporting\n\n## Scope\n\n- Governs:\n  - source registration\n  - trigger registration\n  - event-level reports\n  - aggregatable reports\n  - privacy limits\n- Excludes:\n  - server conversion APIs\n  - click ID storage\n  - vendor upload response handling\n\n## Requirements\n\n- Document source and trigger registration behavior for governed attribution flows.\n- Validate report type, aggregation, timing, and privacy constraints against the selected browser authority.\n- Capture representative event-level and aggregatable report evidence where supported.\n- Keep browser attribution evidence separate from server conversion API evidence.\n\n## Evidence Expectations\n\n- Registration fixtures\n- Report output samples\n- Validation report for privacy and aggregation constraints\n\n",
