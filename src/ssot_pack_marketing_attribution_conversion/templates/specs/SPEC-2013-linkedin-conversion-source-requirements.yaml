  "body": "## Primary Targets\n\n- LinkedIn Conversions overview\n\n## Scope\n\n- Governs:\n  - online conversion sources\n  - offline conversion sources\n  - CRM conversion sources\n  - CSV conversion sources\n  - API conversion sources\n- Excludes:\n  - payload-level Conversions API validation\n  - campaign reporting dashboards\n\n## Requirements\n\n- Classify each LinkedIn conversion source used downstream.\n- Document source-specific evidence and ownership.\n- Keep conversion source classification separate from payload validation.\n- Record unsupported conversion source types explicitly.\n\n## Evidence Expectations\n\n- Conversion source inventory\n- Classification review\n- Source-specific evidence pointer\n\n",
