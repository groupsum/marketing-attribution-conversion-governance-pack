  "body": "## Primary Targets\n\n- IAB Digital Video Ad Measurement Guidelines\n\n## Scope\n\n- Governs:\n  - digital video ad measurement concepts\n  - video exposure evidence\n  - measurement quality for attribution inputs\n- Excludes:\n  - VAST template conformance\n  - OM SDK verification\n  - conversion upload payloads\n\n## Requirements\n\n- Document video ad exposure or measurement evidence used for conversion attribution.\n- Validate measurement-quality assumptions for video-based attribution inputs.\n- Record unsupported video measurement surfaces explicitly.\n- Keep video exposure evidence distinct from conversion event upload evidence.\n\n## Evidence Expectations\n\n- Video measurement fixture\n- Exposure evidence report\n- Measurement-quality review\n\n",
