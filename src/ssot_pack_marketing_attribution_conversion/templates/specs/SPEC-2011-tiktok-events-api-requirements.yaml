  "body": "## Primary Targets\n\n- TikTok Events API\n\n## Scope\n\n- Governs:\n  - web events\n  - app events\n  - offline events\n  - CRM events\n  - identifiers\n  - properties\n  - timestamps\n  - attribution\n  - API responses\n- Excludes:\n  - TikTok pixel-only implementation\n  - campaign management APIs\n\n## Requirements\n\n- Document selected TikTok event source types and event payload fields.\n- Validate identifiers, properties, timestamps, and attribution fields.\n- Capture privacy and consent handling for user data.\n- Record API response evidence for accepted and rejected payloads.\n\n## Evidence Expectations\n\n- Events API request fixture\n- API response sample\n- Validation report for identifiers and properties\n\n",
