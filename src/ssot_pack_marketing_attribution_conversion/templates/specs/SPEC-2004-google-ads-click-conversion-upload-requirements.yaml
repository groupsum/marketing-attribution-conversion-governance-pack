  "body": "## Primary Targets\n\n- Google Ads API upload click conversions\n\n## Scope\n\n- Governs:\n  - click identifiers\n  - conversion action\n  - conversion time\n  - order ID\n  - value\n  - currency\n  - consent\n  - upload response\n- Excludes:\n  - enhanced conversion lead uploads\n  - ValueTrack substitution\n\n## Requirements\n\n- Validate required click conversion upload fields before dispatch.\n- Document timestamp, value, currency, order ID, and consent handling.\n- Capture accepted and rejected upload responses.\n- Separate click conversion uploads from enhanced conversion identifier matching.\n\n## Evidence Expectations\n\n- Upload request fixture\n- API response sample\n- Validation report for required fields\n\n",
