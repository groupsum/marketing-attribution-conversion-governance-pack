  "body": "## Primary Targets\n\n- Google Ads enhanced conversions for leads\n\n## Scope\n\n- Governs:\n  - hashed first-party identifiers\n  - normalization\n  - session attributes\n  - click IDs\n  - consent\n  - upload response\n- Excludes:\n  - plain click conversion uploads\n  - browser attribution reports\n\n## Requirements\n\n- Document supported enhanced conversion identifiers and normalization rules.\n- Validate hashing and redaction behavior without exposing raw personal data.\n- Capture consent and session attribute handling.\n- Record upload response evidence for accepted and rejected payloads.\n\n## Evidence Expectations\n\n- Redacted identifier fixture\n- Hashing validation output\n- Upload response sample\n\n",
