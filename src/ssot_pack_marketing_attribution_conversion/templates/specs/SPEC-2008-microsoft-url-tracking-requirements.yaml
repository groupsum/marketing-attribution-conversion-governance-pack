  "body": "## Primary Targets\n\n- Microsoft Advertising URL tracking with upgraded URLs\n\n## Scope\n\n- Governs:\n  - tracking templates\n  - final URL suffix\n  - parameter substitution\n  - landing URL evidence\n- Excludes:\n  - UET CAPI payloads\n  - OfflineConversion uploads\n\n## Requirements\n\n- Document Microsoft tracking templates and final URL suffix behavior.\n- Validate parameter substitution and landing URL output.\n- Identify click identifiers and campaign parameters captured from URLs.\n- Keep URL tracking evidence separate from conversion upload evidence.\n\n## Evidence Expectations\n\n- Tracking template fixture\n- Substituted landing URL sample\n- Parameter validation report\n\n",
