  "body": "## Primary Targets\n\n- Google Ads auto-tagging / GCLID\n\n## Scope\n\n- Governs:\n  - GCLID\n  - GBRAID\n  - WBRAID\n  - landing URL capture\n  - conversion join readiness\n- Excludes:\n  - ValueTrack parameter substitution\n  - conversion upload payload shape\n\n## Requirements\n\n- Document which Google click identifiers are accepted and where they are captured.\n- Validate landing URL capture and persistence behavior for accepted identifiers.\n- Define retention, redaction, and join behavior before conversion upload claims rely on these IDs.\n- Record fallback behavior when click identifiers are absent.\n\n## Evidence Expectations\n\n- Landing URL fixtures with click IDs\n- Storage and retention test output\n- Conversion join sample\n\n",
