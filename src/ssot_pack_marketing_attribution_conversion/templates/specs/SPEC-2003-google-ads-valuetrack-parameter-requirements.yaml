  "body": "## Primary Targets\n\n- Google Ads ValueTrack parameters\n\n## Scope\n\n- Governs:\n  - tracking templates\n  - dynamic URL parameters\n  - landing URL insertion\n  - accepted parameter inventory\n- Excludes:\n  - conversion upload APIs\n  - Microsoft URL tracking\n\n## Requirements\n\n- Inventory accepted ValueTrack parameters and local handling rules.\n- Validate dynamic parameter substitution and final landing URL shape.\n- Distinguish Google-defined ValueTrack parameters from local campaign parameters.\n- Reject or classify unrecognized parameters before attribution evidence uses them.\n\n## Evidence Expectations\n\n- Tracking template fixtures\n- Substituted landing URL samples\n- Parameter validation report\n\n",
