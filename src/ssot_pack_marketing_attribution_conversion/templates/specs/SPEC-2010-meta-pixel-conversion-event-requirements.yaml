  "body": "## Primary Targets\n\n- Meta Pixel reference\n\n## Scope\n\n- Governs:\n  - browser pixel conversion events\n  - event parameters\n  - event IDs\n  - browser/server deduplication\n- Excludes:\n  - server-only Conversions API payloads\n  - non-conversion pixel events\n\n## Requirements\n\n- Document pixel conversion event names and parameters.\n- Validate event ID behavior when deduplication with server events is required.\n- Capture browser event evidence and network payloads where applicable.\n- Keep browser pixel evidence distinct from server API response evidence.\n\n## Evidence Expectations\n\n- Pixel event fixture\n- Browser network sample\n- Deduplication mapping\n\n",
