  "body": "## Primary Targets\n\n- Microsoft Advertising UET Conversion API\n\n## Scope\n\n- Governs:\n  - server-side UET events\n  - MSCLKID\n  - consent\n  - event time\n  - event value\n  - API response\n- Excludes:\n  - OfflineConversion data object\n  - Microsoft URL tracking templates\n\n## Requirements\n\n- Document UET CAPI event payload fields and required identifiers.\n- Validate MSCLKID, consent, event time, value, and currency behavior where used.\n- Capture API request and response evidence.\n- Keep UET CAPI evidence separate from offline conversion upload evidence.\n\n## Evidence Expectations\n\n- UET CAPI request fixture\n- API response sample\n- Validation report for identifiers and consent\n\n",
