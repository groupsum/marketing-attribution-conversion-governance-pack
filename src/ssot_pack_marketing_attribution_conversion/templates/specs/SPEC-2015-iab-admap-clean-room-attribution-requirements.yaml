  "body": "## Primary Targets\n\n- IAB Tech Lab ADMaP\n- IAB Data Clean Rooms guidance\n\n## Scope\n\n- Governs:\n  - deterministic first-party matching\n  - PET workflow\n  - clean-room attribution outputs\n  - measurement evidence\n- Excludes:\n  - direct vendor conversion uploads\n  - browser attribution reports\n\n## Requirements\n\n- Document clean-room parties, input datasets, matching keys, privacy controls, and attribution outputs.\n- Validate workflow evidence against selected ADMaP or data clean room requirements.\n- Record privacy-enhancing technology assumptions and limitations.\n- Keep clean-room evidence separate from conversion API evidence.\n\n## Evidence Expectations\n\n- Clean-room workflow artifact\n- Matching/output evidence\n- Privacy-control review\n\n",
