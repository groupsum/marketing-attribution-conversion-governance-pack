  "body": "## Primary Targets\n\n- LinkedIn Conversions API\n\n## Scope\n\n- Governs:\n  - conversion rules\n  - event payloads\n  - timestamps\n  - user identifiers\n  - campaign association\n  - API version evidence\n- Excludes:\n  - CSV conversion upload procedures\n  - general LinkedIn reporting APIs\n\n## Requirements\n\n- Document LinkedIn conversion rules and event payload requirements.\n- Validate timestamps, user identifiers, campaign association, and API version handling.\n- Capture privacy and hashing behavior for user identifiers.\n- Record API response evidence for accepted and rejected payloads.\n\n## Evidence Expectations\n\n- Conversions API request fixture\n- API response sample\n- Versioned API evidence\n\n",
