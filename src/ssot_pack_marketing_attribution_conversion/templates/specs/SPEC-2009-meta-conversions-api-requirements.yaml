  "body": "## Primary Targets\n\n- Meta Conversions API\n\n## Scope\n\n- Governs:\n  - event name\n  - event time\n  - action source\n  - user data\n  - custom data\n  - event ID\n  - deduplication\n  - response evidence\n- Excludes:\n  - Meta Pixel browser-only events\n  - campaign URL tagging\n\n## Requirements\n\n- Validate Meta CAPI event payload fields before dispatch.\n- Document user data normalization, hashing, and consent behavior.\n- Capture event ID and deduplication behavior where browser and server events overlap.\n- Record API response evidence for accepted and rejected payloads.\n\n## Evidence Expectations\n\n- CAPI request fixture\n- API response sample\n- Deduplication evidence\n\n",
