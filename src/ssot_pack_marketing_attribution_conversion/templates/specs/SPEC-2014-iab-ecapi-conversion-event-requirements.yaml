  "body": "## Primary Targets\n\n- IAB Tech Lab ECAPI\n\n## Scope\n\n- Governs:\n  - standardized event fields\n  - conversion communication\n  - exchange evidence\n  - field mappings\n- Excludes:\n  - vendor-specific conversion API payloads\n  - clean-room matching workflows\n\n## Requirements\n\n- Document ECAPI event and conversion fields represented downstream.\n- Validate field mappings before exchange.\n- Capture exchange evidence for accepted and rejected payloads.\n- Keep ECAPI conformance separate from vendor endpoint acceptance.\n\n## Evidence Expectations\n\n- ECAPI payload fixture\n- Exchange validation output\n- Field mapping table\n\n",
