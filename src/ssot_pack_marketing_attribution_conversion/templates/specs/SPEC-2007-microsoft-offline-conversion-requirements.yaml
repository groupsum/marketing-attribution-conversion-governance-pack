  "body": "## Primary Targets\n\n- Microsoft Advertising OfflineConversion data object\n\n## Scope\n\n- Governs:\n  - conversion name\n  - conversion time\n  - conversion value\n  - currency\n  - MicrosoftClickId\n  - external attribution fields\n  - hashed identifiers\n- Excludes:\n  - UET CAPI event API\n  - URL tracking template substitution\n\n## Requirements\n\n- Validate OfflineConversion fields before upload.\n- Document MicrosoftClickId and hashed identifier handling.\n- Capture external attribution credit and model behavior where used.\n- Record accepted and rejected upload evidence.\n\n## Evidence Expectations\n\n- OfflineConversion payload fixture\n- API response sample\n- Validation report for conversion fields\n\n",
