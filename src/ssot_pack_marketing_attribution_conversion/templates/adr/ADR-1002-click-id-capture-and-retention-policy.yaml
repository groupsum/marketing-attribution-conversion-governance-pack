  "body": "## Authority Sources\n\n- Google Ads auto-tagging\n- Google Ads click conversion uploads\n- Microsoft Advertising UET Conversion API\n- Microsoft Advertising OfflineConversion\n\n## Context\n\n- Click identifiers are attribution inputs that must be captured, retained, and joined before conversion uploads can be trusted.\n- Different advertising platforms define different click identifiers and acceptance windows.\n\n## Decision\n\n- Document accepted click identifiers and the surfaces where they are captured.\n- Govern capture, storage, retention, redaction, and conversion join behavior for click identifiers.\n- Treat GCLID, GBRAID, WBRAID, and MSCLKID as distinct identifiers with source-specific requirements.\n- Do not treat click ID capture as proof of conversion upload conformance.\n\n## Consequences\n\n- Conversion evidence must show which click identifier was captured and retained.\n- Retention and privacy controls must be documented for click identifiers.\n- Missing click identifiers require explicit fallback or out-of-scope decisions.\n\n"
