  "title": "Conversion Consent And Privacy Policy",
  "status": "accepted",
  "supersedes": [],
  "superseded_by": [],
  "context": [
    "Conversion payloads often include consent, processing restrictions, identifiers, and user-data fields.",
    "Privacy-sensitive fields must be governed before conversion data is shared with advertising platforms."
  ],
  "decision": [
    "Document consent and privacy fields required by each selected conversion authority.",
    "Govern suppression, redaction, hashing, limited-use flags, and consent-state mapping for conversion events.",
    "Do not send privacy-sensitive conversion fields without recorded downstream authority and evidence.",
    "Keep consent handling evidence linked to the conversion payloads it controls."
  ],
  "authority_sources": [
    "Google Ads click and enhanced conversion uploads",
    "Microsoft Advertising UET Conversion API",
    "Meta Conversions API",
    "TikTok Events API",
    "LinkedIn Conversions API"
  ],
  "consequences": [
    "Conversion fixtures must show privacy fields or documented suppression behavior.",
    "Evidence must prove consent-state mapping for representative payloads.",
    "Privacy gaps must block conformance claims for affected conversion surfaces."
  ]
}
