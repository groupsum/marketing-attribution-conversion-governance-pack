  "context": [
    "Clean-room attribution workflows use privacy-enhancing methods to match first-party data and produce attribution outputs.",
    "These workflows differ from direct vendor conversion upload APIs."
  ],
  "decision": [
    "Document whether clean-room attribution protocols govern downstream attribution measurement.",
    "Use ADMaP when deterministic first-party matching, privacy-enhancing technology workflow, and attribution output standardization are required.",
    "Keep clean-room attribution workflow evidence separate from server conversion API evidence.",
    "Record parties, input datasets, matching keys, privacy controls, and output measures where applicable."
  ],
  "authority_sources": [
    "IAB Tech Lab Attribution Data Matching Protocol",
    "IAB Data Clean Rooms guidance"
  ],
  "consequences": [
    "Evidence must include clean-room workflow, matching, and output artifacts appropriate to the downstream environment.",
    "Attribution claims must identify privacy-enhancing controls and matching assumptions.",
    "Direct conversion API acceptance does not prove clean-room attribution conformance."
  ]
