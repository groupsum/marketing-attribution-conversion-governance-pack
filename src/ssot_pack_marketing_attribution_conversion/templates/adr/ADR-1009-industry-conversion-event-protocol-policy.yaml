  "references": [],
  "body": "## Authority Sources\n\n- IAB Tech Lab Event and Conversion API\n\n## Context\n\n- Industry event and conversion protocols provide interoperability targets that are separate from platform-specific conversion APIs.\n- A downstream system may need to support ECAPI-style event exchange in addition to vendor endpoints.\n\n## Decision\n\n- Document whether an industry conversion event protocol is a downstream interoperability target.\n- Use IAB ECAPI when standardized event and conversion communication is required.\n- Keep ECAPI conformance separate from vendor API conformance.\n- Record field mappings and exchange evidence for industry conversion event payloads.\n\n## Consequences\n\n- Evidence must include ECAPI payload fixtures and exchange validation.\n- Vendor-specific accepted payloads cannot substitute for ECAPI conformance.\n- Field mapping gaps must be documented explicitly.\n\n"
