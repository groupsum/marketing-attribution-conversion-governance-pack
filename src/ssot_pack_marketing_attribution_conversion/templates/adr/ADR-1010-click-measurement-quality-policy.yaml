{
  "id": "adr:click-measurement-quality-policy",
  "number": 1010,
  "slug": "click-measurement-quality-policy",
  "title": "Click Measurement Quality Policy",
  "status": "accepted",
  "supersedes": [],
  "superseded_by": [],
  "context": [
    "Attribution quality depends on valid click measurement, filtration, reporting parameters, and auditable evidence.",
    "Click measurement quality is not the same as click identifier capture."
  ],
  "decision": [
    "Document click measurement quality controls where downstream attribution relies on click counts or clickthrough evidence.",
    "Use IAB Click Measurement Guidelines for valid click lifecycle, invalid click filtration, and click reporting controls.",
    "Use video ad measurement and measurement-quality references when attribution depends on media exposure evidence.",
    "Keep measurement quality evidence separate from conversion upload evidence."
  ],
  "authority_sources": [
    "IAB Click Measurement Guidelines",
    "IAB Digital Video Ad Measurement Guidelines",
    "Media Rating Council measurement standards"
  ],
  "consequences": [
    "Click attribution claims must identify valid-click and filtration evidence.",
    "Invalid-click handling must be auditable.",
    "Exposure and click quality gaps must be explicit before downstream conversion claims rely on them."
  ]
}
