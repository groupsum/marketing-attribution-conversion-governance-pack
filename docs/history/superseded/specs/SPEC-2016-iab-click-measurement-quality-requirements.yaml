  "body": "## Primary Targets\n\n- IAB Click Measurement Guidelines\n\n## Scope\n\n- Governs:\n  - valid click lifecycle\n  - invalid click filtration\n  - clickthrough distinctions\n  - reporting parameters\n  - audit evidence\n- Excludes:\n  - click ID capture storage\n  - conversion upload API payloads\n\n## Requirements\n\n- Document valid click lifecycle and filtration controls.\n- Validate invalid click exclusion and reporting parameter behavior.\n- Separate clickthrough evidence from in-unit click evidence where applicable.\n- Capture audit-ready click measurement evidence.\n\n## Evidence Expectations\n\n- Click lifecycle fixture\n- Filtration report\n- Audit evidence sample\n\n",
