body: |-
  ## Context
  
  Click identifiers and tracking templates are upstream attribution inputs. They must be captured and retained correctly before they can support conversion joins or upload APIs.
  
  ## Decision
  
  This pack includes Google Ads auto-tagging identifiers, Google ValueTrack parameters, Microsoft click identifiers, and Microsoft upgraded URL tracking as click identity and tracking-template authorities.
  
  Click identifier and tracking-template authorities govern landing URL parameter capture, URL substitution, final URL suffix behavior, retention, and join readiness. They do not by themselves govern conversion upload payload shape.
  
  ## Authority Sources
  
  - Google Ads auto-tagging and GCLID documentation.
  - Google Ads ValueTrack parameters.
  - Microsoft Advertising URL tracking with upgraded URLs.
  - Microsoft Advertising click identifiers used by UET CAPI and OfflineConversion.
