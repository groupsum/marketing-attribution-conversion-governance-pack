body: |-
  ## Context
  
  Industry attribution and measurement protocols define interoperability, clean-room matching, event communication, and measurement quality expectations that differ from vendor-specific conversion APIs.
  
  ## Decision
  
  This pack includes IAB and measurement-quality sources when they govern attribution matching, conversion event exchange, valid click measurement, digital video ad measurement, clean-room measurement, or audit-quality measurement evidence.
  
  The included sources are IAB ADMaP, IAB ECAPI, IAB Click Measurement Guidelines, IAB Digital Video Ad Measurement Guidelines, IAB Data Clean Rooms guidance, and Media Rating Council measurement standards where they support attribution and conversion measurement quality.
  
  ## Authority Sources
  
  - IAB Tech Lab Attribution Data Matching Protocol.
  - IAB Tech Lab Event and Conversion API.
  - IAB Click Measurement Guidelines.
  - IAB Digital Video Ad Measurement Guidelines.
  - IAB Data Clean Rooms guidance.
  - Media Rating Council measurement standards.
