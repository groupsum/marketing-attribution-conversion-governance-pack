body: |-
  ## Purpose
  
  Define pack-local requirements for browser attribution measurement targets.
  
  ## Requirements
  
  - W3C Attribution Reporting coverage must govern browser source registration, trigger registration, event-level reports, aggregatable reports, privacy budgets, report timing, and aggregation behavior.
  - Browser attribution targets must remain separate from click ID capture and vendor server conversion APIs.
  - Browser attribution reporting evidence must include registration and report artifacts when this target is represented in downstream templates.
  - Adjacent advertising APIs or vendor conversion APIs must not be described as browser attribution targets unless they directly implement the selected browser attribution authority.
  
  ## Evidence Expectations
  
  - Target inventory for W3C Attribution Reporting.
  - Template review showing downstream conformance coverage for browser attribution reporting.
